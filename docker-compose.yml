services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyloop}
      POSTGRES_DB: ${POSTGRES_DB:-keyloop}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyloop}
      POSTGRES_DB: ${POSTGRES_DB:-keyloop_test}
    ports:
      - '5433:5432'

volumes:
  pgdata:
