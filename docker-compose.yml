services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: keyloop
      POSTGRES_PASSWORD: keyloop
      POSTGRES_DB: keyloop
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: keyloop
      POSTGRES_PASSWORD: keyloop
      POSTGRES_DB: keyloop_test
    ports:
      - '5433:5432'

volumes:
  pgdata:
